<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Hub v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Family Hub v2</h1>
      <p id="syncStatus">Starting…</p>
    </div>
  </header>

  <main class="layout">
    <section id="dashboardPanel" class="panel">
  <div class="section-title">
    <h2>📊 Dashboard</h2>
  </div>

  <div class="dashboard-grid">

    <div class="dashboard-card" data-dashboard-filter="overdue">
      <h3>🔴 Overdue</h3>
      <p id="overdueCount">0</p>
    </div>

    <div class="dashboard-card" data-dashboard-filter="today">
      <h3>🟡 Due Today</h3>
      <p id="todayCount">0</p>
    </div>

    <div class="dashboard-card" data-dashboard-filter="upcoming">
      <h3>🟢 Upcoming</h3>
      <p id="upcomingCount">0</p>
    </div>

    <div class="dashboard-card" data-dashboard-filter="completed">
      <h3>✅ Completed</h3>
      <p id="completedCount">0</p>
    </div>

  </div>

  <div id="dashboardResults" class="dashboard-results hidden"></div>

</section>

<section id="calendarPanel" class="panel">
  <div class="section-title">
    <h2>📅 Calendar</h2>
  </div>

  <div class="calendar-header">
    <button id="prevMonthBtn" type="button" class="ghost">←</button>
    <h3 id="calendarTitle">Month</h3>
    <button id="nextMonthBtn" type="button" class="ghost">→</button>
  </div>

  <div id="calendarGrid" class="calendar-grid"></div>

<div id="calendarDayPanel" class="calendar-day-panel hidden">
  <h3 id="calendarDayTitle">Selected Day</h3>
  <div id="calendarDayTasks"></div>
</div>

</section>

<section id="membersPanel" class="panel">
  <div class="section-title">
    <h2>Members</h2>
  </div>

  <form id="memberForm" class="form-grid">
    <input id="memberName" placeholder="Name" required>

    <select id="memberEmoji">
      <option>👤</option>
      <option>👨</option>
      <option>👩</option>
      <option>👦</option>
      <option>👧</option>
    </select>

    <select id="memberRole">
      <option value="parent">Parent</option>
      <option value="child">Child</option>
      <option value="member">Member</option>
    </select>

    <button type="submit">Add member</button>
  </form>

  <div id="membersList" class="list"></div>
</section>
    <section id="workspacePanel" class="panel hidden">
      <button id="backToMembers" class="ghost" type="button">← Back to members</button>
      <h2 id="workspaceTitle">Workspace</h2>
      <div id="breadcrumb" class="breadcrumb"></div>

      <div class="workspace-actions">
        <button id="addItemBtn" type="button">➕ Add</button>
      </div>

      <div class="workspace-layout">

  <div id="folderList" class="list"></div>

  <div id="detailsPanel" class="details-panel hidden">
    <label>
  Completed
  <input id="detailsDone" type="checkbox">
</label>

<label>
  Due date
  <input id="detailsDueDate" type="date">
</label>

<label>
  Priority
  <select id="detailsPriority">
    <option value="">None</option>
    <option value="low">🟢 Low</option>
    <option value="medium">🟡 Medium</option>
    <option value="high">🔴 High</option>
  </select>
</label>
    <h3>Details</h3>

    <label>
      Title
      <input id="detailsTitle">
    </label>

    <label>
      Type
      <input id="detailsType" disabled>
    </label>

    <button id="saveDetailsBtn" type="button">
      Save changes
    </button>
  </div>

</div>
  
    </section>
    
  </main>
<script>
window.addEventListener("error", function (e) {
  document.getElementById("syncStatus").textContent = "JS error: " + e.message;
});

window.addEventListener("unhandledrejection", function (e) {
  document.getElementById("syncStatus").textContent =
    "Promise error: " + (e.reason?.message || e.reason);
});
</script>

<div id="addModal" class="modal hidden">
  <div class="modal-card">
    <h2>➕ Add</h2>

    <div class="type-grid">
      <button type="button" data-type="folder">📁 Folder</button>
      <button type="button" data-type="task">✅ Task</button>
      <button type="button" data-type="note">📝 Note</button>
      <button type="button" data-type="checklist">☑ Checklist</button>
    </div>

    <input id="addItemName" placeholder="Name">

    <div class="modal-actions">
      <button id="cancelAddModal" type="button" class="ghost">Cancel</button>
      <button id="createAddModal" type="button">Create</button>
    </div>
  </div>
</div>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
